name: Preprocessing Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'preprocessing/**'
      - 'housing_raw/**'
      - '.github/workflows/preprocessing.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocess:
    name: Run automated preprocessing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run preprocessing automation
        run: |
          python preprocessing/automate_Muhammad-Fadhil-Rizki.py \
            --raw housing_raw/housing.csv \
            --out housing_preprocessing

      - name: Show output files
        run: |
          ls -lh housing_preprocessing/
          echo "Total files:"
          ls housing_preprocessing/ | wc -l

      - name: Upload preprocessing artifacts
        uses: actions/upload-artifact@v4
        with:
          name: housing_preprocessing
          path: housing_preprocessing/
          retention-days: 30

      - name: Commit preprocessing output to repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add housing_preprocessing/
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan output untuk di-commit."
          else
            git commit -m "ci: regenerate housing_preprocessing artifacts [skip ci]"
            git push
          fi
